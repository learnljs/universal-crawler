task:
  name: ui_task4
  purpose: 信息采集
  description: Generated by Crawl Studio
target:
  site_name: ui_task4
  base_url: https://www.biquge.tw
  entry_urls:
  - https://www.biquge.tw/book/
  allowed_domains:
  - biquge.tw
request:
  method: GET
  type: static
  headers:
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36
  cookies: {}
  params: {}
  payload: {}
  encoding: auto
  timeout:
    connect: 10
    read: 30
browser:
  enabled: false
  engine: chromium
  headless: true
  wait_until: networkidle
  wait_selector: ''
  actions: []
pagination:
  enabled: false
  type: none
  page_param: page
  start_page: 1
  end_page: 1
  url_template: ''
  next_page_selector: ''
  max_pages: 5
  cursor_param: cursor
  cursor_start: ''
  next_cursor_path: $.data.next_cursor
  stop_when_empty_path: $.data.items
list:
  item_selector: ''
  fields: {}
detail:
  enabled: false
  url_field: detail_url
  keep_on_detail_failed: true
  fields: {}
api:
  enabled: false
  data_path: $
  fields: {}
media:
  enabled: false
  output_dir: data/media/ui_task
  skip_existing: true
  parse_attachments: false
  parse_config:
    max_chars: 200000
  resources: []
cleaning:
  strip: true
  normalize_space: true
  html_unescape: true
  remove_tracking_params: true
dedupe:
  enabled: true
  type: persistent
  key_fields: []
  path: data/state/ui_task4_dedupe.txt
resume:
  enabled: true
  retry_failed_first: true
  completed_path: data/state/ui_task4_completed_urls.txt
  failed_path: data/state/ui_task4_failed.jsonl
rate_limit:
  delay_min: 0.0
  delay_max: 0.0
  concurrency: 1
retry:
  times: 2
  backoff: 1.0
  retry_status:
  - 429
  - 500
  - 502
  - 503
  - 504
storage:
  type: csv
  path: data/output/ui_task4.csv
  table: items
logging:
  enabled: true
  level: INFO
  request_log: data/logs/ui_task4_requests.jsonl
  error_log: data/logs/ui_task4_errors.jsonl
  summary_log: data/logs/ui_task4_summary.jsonl
