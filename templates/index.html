<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crawl Studio</title>
  <link rel="stylesheet" href="/static/styles.css?v=20260506-import-file-1">
</head>
<body>
  <div class="studio-shell">
    <header class="hero">
      <div class="hero-copy">
        <div class="brand-row">
          <div class="brand-mark">C</div>
          <div>
            <p class="eyebrow">Crawl Studio</p>
            <h1>配置化爬虫任务工作台</h1>
          </div>
        </div>
        <p class="hero-text">选择页面类型、翻页策略、字段、媒体下载和存储方式，生成 YAML 后直接运行。</p>
      </div>
      <div class="hero-actions">
        <button type="button" class="soft" id="generateBtn">生成 YAML</button>
        <button type="button" class="soft" id="saveBtn">保存配置</button>
        <button type="button" class="primary" id="runBtn">运行任务</button>
      </div>
    </header>

    <section class="quick-strip">
      <a href="#basic">任务入口</a>
      <a href="#request">请求渲染</a>
      <a href="#pagination">翻页策略</a>
      <a href="#extract">字段提取</a>
      <a href="#media">媒体附件</a>
      <a href="#runtime">运行存储</a>
    </section>

    <main class="studio-grid">
      <section class="left-stack">
        <form id="builderForm">
          <section id="basic" class="section-card large-card">
            <div class="card-head">
              <div>
                <span class="step">01</span>
                <h2>任务与入口</h2>
              </div>
              <p>给任务命名，填写入口地址和目标域名。</p>
            </div>
            <div class="field-grid four">
              <label>任务名称<input name="task_name" value="ui_task"></label>
              <label>配置文件名<input name="config_name" value="ui_generated.yaml"></label>
              <label>爬取目的
                <select name="purpose">
                  <option>信息采集</option>
                  <option>社交评论采集</option>
                  <option>视频字幕采集</option>
                  <option>图片图集采集</option>
                  <option>附件下载解析</option>
                  <option>数据监控</option>
                </select>
              </label>
              <label>站点名称<input name="site_name" value="example"></label>
            </div>
            <div class="field-grid two">
              <label>任务说明<input name="description" value="Generated by Crawl Studio"></label>
              <label>Base URL<input name="base_url" placeholder="https://example.com"></label>
            </div>
            <div class="field-grid two">
              <label>入口 URL，一行一个<textarea name="entry_urls" rows="4" placeholder="https://example.com/list"></textarea></label>
              <label>允许域名，一行一个<textarea name="allowed_domains" rows="4" placeholder="example.com"></textarea></label>
            </div>
          </section>

          <section id="request" class="section-card">
            <div class="card-head compact">
              <div>
                <span class="step">02</span>
                <h2>请求与动态页面</h2>
              </div>
            </div>
            <div class="field-grid three">
              <label>请求类型
                <select name="request_type">
                  <option value="static">静态 HTML</option>
                  <option value="api">JSON API</option>
                  <option value="dynamic">动态页面</option>
                </select>
              </label>
              <label>请求方法
                <select name="method">
                  <option>GET</option>
                  <option>POST</option>
                </select>
              </label>
              <label>编码<input name="encoding" value="auto"></label>
            </div>
            <div class="field-grid two">
              <label>User-Agent<input name="user_agent" value="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"></label>
              <label>Authorization<input name="authorization" placeholder="Bearer YOUR_TOKEN"></label>
              <label>Referer<input name="referer" placeholder="https://example.com"></label>
              <label>等待选择器<input name="wait_selector" placeholder=".item"></label>
            </div>
            <div class="pill-row">
              <label><input type="checkbox" name="browser_enabled"> 浏览器渲染</label>
              <label><input type="checkbox" name="headless" checked> 无头模式</label>
              <label><input type="checkbox" name="scroll_enabled"> 滚动加载</label>
            </div>
            <div class="field-grid four">
              <label>浏览器
                <select name="browser_engine">
                  <option>chromium</option>
                  <option>firefox</option>
                  <option>webkit</option>
                </select>
              </label>
              <label>等待时机
                <select name="wait_until">
                  <option>networkidle</option>
                  <option>load</option>
                  <option>domcontentloaded</option>
                </select>
              </label>
              <label>滚动次数<input name="scroll_times" type="number" value="3"></label>
              <label>滚动间隔秒<input name="scroll_pause" type="number" step="0.1" value="1"></label>
            </div>
          </section>

          <section id="pagination" class="section-card">
            <div class="card-head compact">
              <div>
                <span class="step">03</span>
                <h2>翻页策略</h2>
              </div>
            </div>
            <div class="field-grid three">
              <label>翻页类型
                <select name="pagination_type">
                  <option value="none">不翻页</option>
                  <option value="page_param">页码参数</option>
                  <option value="url_template">URL 模板</option>
                  <option value="next_link">下一页链接</option>
                  <option value="cursor">接口游标</option>
                </select>
              </label>
              <label>开始页<input name="start_page" type="number" value="1"></label>
              <label>结束页<input name="end_page" type="number" value="1"></label>
              <label>页码参数<input name="page_param" value="page"></label>
              <label>最大页数<input name="max_pages" type="number" value="5"></label>
              <label>Cursor 参数<input name="cursor_param" value="cursor"></label>
            </div>
            <div class="field-grid two">
              <label>URL 模板<input name="url_template" placeholder="https://example.com/list/{page}"></label>
              <label>下一页选择器<input name="next_page_selector" placeholder="a.next"></label>
            </div>
            <label>下一页 Cursor JSONPath<input name="next_cursor_path" value="$.data.next_cursor"></label>
          </section>

          <section id="extract" class="section-card">
            <div class="card-head compact">
              <div>
                <span class="step">04</span>
                <h2>字段提取</h2>
              </div>
            </div>
            <label>列表项选择器<input name="item_selector" placeholder=".item，留空表示整页一个对象"></label>
            <div class="field-grid two tall">
              <label>HTML 字段规则
                <textarea name="fields" rows="8" placeholder="title|.title::text&#10;detail_url|a::attr(href)|css|false|absolute_url&#10;images|img::attr(src)|css|true|absolute_url"></textarea>
              </label>
              <label>API 字段规则
                <textarea name="api_fields" rows="8" placeholder="id|$.id&#10;title|$.title&#10;content|$.content"></textarea>
              </label>
            </div>
            <div class="field-grid two">
              <label>API 数据路径<input name="api_data_path" value="$"></label>
              <label>详情 URL 字段<input name="detail_url_field" value="detail_url"></label>
            </div>
            <div class="pill-row">
              <label><input type="checkbox" name="detail_enabled"> 启用详情页</label>
            </div>
            <label>详情页字段规则<textarea name="detail_fields" rows="4" placeholder="content|.article p::text|css|true"></textarea></label>
          </section>

          <section id="media" class="section-card">
            <div class="card-head compact">
              <div>
                <span class="step">05</span>
                <h2>富媒体与附件解析</h2>
              </div>
            </div>
            <div class="pill-row">
              <label><input type="checkbox" name="media_enabled"> 媒体下载</label>
              <label><input type="checkbox" name="parse_attachments"> PDF/Word/Excel 解析</label>
            </div>
            <div class="field-grid three">
              <label>媒体目录<input name="media_output_dir" value="data/media/ui_task"></label>
              <label>解析最大字符数<input name="parse_max_chars" type="number" value="200000"></label>
              <label>图片字段<input name="image_fields" placeholder="image_url,image_urls"></label>
              <label>音频字段<input name="audio_fields" placeholder="audio_url"></label>
              <label>视频字段<input name="video_fields" placeholder="video_url"></label>
              <label>字幕字段<input name="subtitle_fields" placeholder="subtitle_url"></label>
            </div>
            <label>附件字段<input name="attachment_fields" placeholder="pdf_url,word_url,excel_url"></label>
          </section>

          <section id="runtime" class="section-card">
            <div class="card-head compact">
              <div>
                <span class="step">06</span>
                <h2>存储、日志、续跑</h2>
              </div>
            </div>
            <div class="field-grid three">
              <label>存储方式
                <select name="storage_type">
                  <option>jsonl</option>
                  <option>csv</option>
                  <option>sqlite</option>
                </select>
              </label>
              <label>输出路径<input name="output_path" placeholder="data/output/ui_task.jsonl"></label>
              <label>SQLite 表名<input name="table" value="items"></label>
            </div>
            <div class="pill-row">
              <label><input type="checkbox" name="dedupe_enabled" checked> 去重</label>
              <label><input type="checkbox" name="resume_enabled" checked> 失败续跑</label>
              <label><input type="checkbox" name="retry_failed_first" checked> 优先失败队列</label>
              <label><input type="checkbox" name="logging_enabled" checked> 记录日志</label>
            </div>
            <div class="field-grid three">
              <label>去重方式
                <select name="dedupe_type">
                  <option>persistent</option>
                  <option>memory</option>
                  <option>file</option>
                </select>
              </label>
              <label>去重字段<input name="dedupe_fields" placeholder="id,detail_url"></label>
              <label>重试次数<input name="retry_times" type="number" value="2"></label>
              <label>退避秒<input name="retry_backoff" type="number" step="0.1" value="1"></label>
              <label>最小延迟<input name="delay_min" type="number" step="0.1" value="0"></label>
              <label>最大延迟<input name="delay_max" type="number" step="0.1" value="0"></label>
            </div>
          </section>
        </form>
      </section>

      <aside class="right-stack">
        <section class="side-card config-card">
          <div class="side-head">
            <div>
              <h2>配置预览</h2>
              <p id="status">就绪</p>
            </div>
            <span class="badge">YAML</span>
          </div>
          <textarea id="yamlOutput" spellcheck="false"></textarea>
        </section>

        <section class="side-card">
          <div class="side-head">
            <div>
              <h2>运行输出</h2>
              <p>任务日志会同步写入 data/logs</p>
            </div>
          </div>
          <pre id="runOutput">等待运行...</pre>
        </section>

        <section class="side-card">
          <div class="side-head">
            <div>
              <h2>读取已有配置</h2>
              <p>从 configs 目录载入 YAML</p>
            </div>
          </div>
          <div class="load-row">
            <select id="configSelect">
              <option value="">正在读取配置...</option>
            </select>
            <button type="button" class="soft" id="loadBtn">读取</button>
          </div>
          <div class="load-row">
            <label class="soft file-trigger" for="importFile">选择文件</label>
            <input id="importFile" class="sr-only" type="file" accept=".yaml,.yml,text/yaml,text/x-yaml">
            <span id="importFileName" class="file-name">未导入本地文件</span>
          </div>
          <p class="mini-tip" id="configListHint">正在连接后端 API...</p>
        </section>
      </aside>
    </main>
  </div>
  <script src="/static/app.js?v=20260506-import-file-1"></script>
</body>
</html>
